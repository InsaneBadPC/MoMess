<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MoMess</title>
  <meta name="theme-color" content="#0b0c0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #0b0c0e;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .screen {
      display: none;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      flex-direction: column;
      position: absolute;
      top: 0;
      left: 0;
      background: #0b0c0e;
    }
    .screen.active {
      display: flex;
    }

    /* 1. SEZNAM KONVERZACÍ */
    .inbox-top-bar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .inbox-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .inbox-actions {
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .icon-btn {
      background: #242527;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    .search-box {
      padding: 10px 16px 6px 16px;
    }
    .search-input-wrapper {
      background: #1e1f21;
      border-radius: 20px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-input-wrapper svg {
      width: 18px;
      height: 18px;
      fill: #72767d;
    }
    .search-input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 15px;
      width: 100%;
      user-select: text;
    }
    .search-input::placeholder {
      color: #72767d;
    }

    .conv-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
    }
    .conv-list::-webkit-scrollbar {
      display: none;
    }
    .conv-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      gap: 14px;
      border-radius: 12px;
      cursor: pointer;
      position: relative;
    }
    .conv-item:active {
      background: #18191b;
    }
    .conv-avatar-wrap {
      position: relative;
      width: 52px;
      height: 52px;
      flex-shrink: 0;
    }
    .conv-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background-color: #262729;
      background-size: cover;
      background-position: center;
    }
    .conv-badge {
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #31a24c;
      border: 2.5px solid #0b0c0e;
    }
    .conv-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .conv-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .conv-name {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conv-time {
      font-size: 12px;
      color: #8b8e94;
      flex-shrink: 0;
    }
    .conv-snippet {
      font-size: 14px;
      color: #8b8e94;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conv-edit-btn {
      padding: 8px;
      margin-left: 4px;
      color: #777;
      cursor: pointer;
    }
    .conv-edit-btn svg {
      width: 18px;
      height: 18px;
      fill: #777;
    }

    /* 2. CHAT SCREEN (1:1 S FOTKOU) */
    .chat-top-bar {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: #0b0c0e;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 10;
    }
    .chat-top-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      cursor: pointer;
      min-width: 0;
    }
    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      cursor: pointer;
    }
    .back-btn svg {
      width: 24px;
      height: 24px;
      fill: #ffffff;
    }
    .chat-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #262729;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }
    .chat-contact-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .chat-contact-name {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-contact-status {
      font-size: 12px;
      color: #92959a;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      background-color: #31a24c;
      border-radius: 50%;
      display: inline-block;
    }

    .chat-top-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .chat-top-actions svg {
      width: 24px;
      height: 24px;
      fill: #ffffff;
    }

    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }
    .chat-scroll::-webkit-scrollbar {
      display: none;
    }

    .timestamp-separator {
      align-self: center;
      font-size: 11px;
      color: #72767d;
      font-weight: 500;
      margin: 10px 0 4px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      width: 100%;
      position: relative;
    }
    .message-row.outgoing {
      justify-content: flex-end;
    }
    .message-row.incoming {
      justify-content: flex-start;
    }

    .bubble-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #262729;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      margin-bottom: 2px;
    }
    .bubble-avatar.hidden {
      visibility: hidden;
    }

    .bubble-content-wrap {
      max-width: 76%;
      display: flex;
      flex-direction: column;
    }
    .outgoing .bubble-content-wrap {
      align-items: flex-end;
    }
    .incoming .bubble-content-wrap {
      align-items: flex-start;
    }

    .bubble {
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 15.5px;
      line-height: 1.38;
      word-break: break-word;
    }
    .incoming .bubble {
      background-color: #242527;
      color: #e4e6eb;
      border-bottom-left-radius: 4px;
    }
    .outgoing .bubble {
      background-color: #203a56;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .bubble.image-bubble {
      padding: 0;
      background: transparent;
      overflow: hidden;
      border-radius: 18px;
      max-width: 82%;
    }
    .bubble.image-bubble img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 18px;
    }

    .msg-time-label {
      font-size: 10px;
      color: #72767d;
      margin-top: 2px;
      padding: 0 4px;
    }

    .typing-indicator {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 10px 14px;
      background-color: #242527;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      width: fit-content;
      margin-left: 36px;
    }
    .typing-dot {
      width: 6px;
      height: 6px;
      background-color: #a8abaf;
      border-radius: 50%;
      animation: typing 1.3s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    .bottom-bar {
      min-height: 54px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0b0c0e;
    }
    .plus-btn {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .plus-btn svg {
      width: 24px;
      height: 24px;
      fill: #ffffff;
    }

    .input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      background-color: #1e1f21;
      border-radius: 20px;
      padding: 6px 12px;
      gap: 8px;
    }
    .input-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 15.5px;
      user-select: text;
    }
    .input-field::placeholder {
      color: #83878d;
    }

    .input-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .input-actions svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
      cursor: pointer;
    }
    .send-icon svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
      cursor: pointer;
    }

    /* 3. SETTINGS & EDITOR */
    .settings-screen {
      padding: 16px;
      overflow-y: auto;
      background: #141517;
    }
    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .settings-header h2 {
      font-size: 20px;
      font-weight: 700;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      background: #202225;
      border: 1px solid #333;
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      user-select: text;
    }
    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }
    .btn {
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-secondary { background: #374151; color: #fff; }
    .btn-danger { background: #dc2626; color: #fff; }
    .actions-grid {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
  </style>
</head>
<body>

  <!-- SCREEN 1: SEZNAM ZPRÁV (INBOX) -->
  <div class="screen active" id="screen-inbox">
    <div class="inbox-top-bar">
      <div class="inbox-title">MoMess</div>
      <div class="inbox-actions">
        <div class="icon-btn" id="btn-open-global-settings" title="Nastavení">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </div>
        <div class="icon-btn" id="btn-add-contact" title="Přidat postavu">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </div>
      </div>
    </div>

    <div class="search-box">
      <div class="search-input-wrapper">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" class="search-input" placeholder="Hledat">
      </div>
    </div>

    <div class="conv-list" id="conv-list-container">
      <!-- Seznam generován z JS -->
    </div>
  </div>

  <!-- SCREEN 2: CHATOVACÍ OKNO -->
  <div class="screen" id="screen-chat">
    <div class="chat-top-bar">
      <div class="chat-top-left" id="chat-back-btn">
        <div class="back-btn">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </div>
        <div class="chat-avatar" id="active-chat-avatar"></div>
        <div class="chat-contact-info">
          <span class="chat-contact-name" id="active-chat-name">Martin Sobo</span>
          <span class="chat-contact-status" id="active-chat-status"><span class="status-dot"></span>Aktivní</span>
        </div>
      </div>
      <div class="chat-top-actions">
        <svg viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-2.2 2.2a15.05 15.05 0 0 1-6.59-6.59l2.2-2.21a.96.96 0 0 0 .25-1A11.36 11.36 0 0 1 8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-.99-1z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
      </div>
    </div>

    <div class="chat-scroll" id="chat-messages-container">
      <!-- Zprávy -->
    </div>

    <div class="typing-indicator" id="chat-typing-indicator">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>

    <div class="bottom-bar">
      <div class="plus-btn">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </div>
      <div class="input-wrapper">
        <input type="text" class="input-field" id="chat-input-field" placeholder="Zpráva..." autocomplete="off">
        <div class="input-actions">
          <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
          <svg viewBox="0 0 24 24"><path d="M12 12c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v4c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 12 6.7 9H5c0 3.41 2.72 6.23 6 6.72V20h2v-4.28c3.28-.49 6-3.31 6-6.72h-1.7z"/></svg>
        </div>
      </div>
      <div class="send-icon" id="chat-send-btn">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </div>
    </div>
  </div>

  <!-- SCREEN 3: EDITOR POSTAVY -->
  <div class="screen settings-screen" id="screen-editor">
    <div class="settings-header">
      <h2 id="editor-title">Upravit postavu</h2>
      <button class="btn btn-secondary" id="editor-close-btn">Zavřít</button>
    </div>

    <input type="hidden" id="edit-conv-id">

    <div class="form-group">
      <label>Jméno člověka</label>
      <input type="text" id="edit-name" placeholder="např. Martin Sobo">
    </div>

    <div class="form-group">
      <label>Stav</label>
      <input type="text" id="edit-status" placeholder="např. Aktivní nebo Aktivní před 5 min">
    </div>

    <div class="form-group">
      <label>Avatar URL (nebo ponechat prázdné)</label>
      <input type="text" id="edit-avatar" placeholder="https://... nebo data:image/...">
    </div>

    <div class="form-group">
      <label>Režim odpovědí</label>
      <select id="edit-mode">
        <option value="ai">AI generování podle kontextu</option>
        <option value="script">Pevný scénář kroků (offline failsafe)</option>
      </select>
    </div>

    <div class="form-group" id="grp-context">
      <label>Kontext postavy (kdo je, co smí/nesmí říct, styl)</label>
      <textarea id="edit-context" rows="6"></textarea>
    </div>

    <div class="form-group" id="grp-script" style="display: none;">
      <label>Pevný scénář kroků (JSON)</label>
      <textarea id="edit-script" rows="6"></textarea>
    </div>

    <div class="form-group">
      <label>Simulace psaní (zpoždění v sekundách)</label>
      <input type="number" id="edit-delay" value="2.2" step="0.5">
    </div>

    <div class="form-group">
      <label>Historie zpráv (JSON)</label>
      <textarea id="edit-history" rows="8"></textarea>
    </div>

    <div class="actions-grid">
      <button class="btn btn-primary" style="flex: 2;" id="editor-save-btn">Uložit postavu</button>
      <button class="btn btn-danger" style="flex: 1;" id="editor-delete-btn">Smazat</button>
    </div>
  </div>

  <!-- SCREEN 4: GLOBÁLNÍ NASTAVENÍ -->
  <div class="screen settings-screen" id="screen-global">
    <div class="settings-header">
      <h2>Nastavení aplikace</h2>
      <button class="btn btn-secondary" id="global-close-btn">Zavřít</button>
    </div>

    <div class="form-group">
      <label>Google Gemini API Key</label>
      <input type="password" id="cfg-gemini-key" placeholder="AI Studio Key">
    </div>

    <div class="form-group">
      <label>Zobrazení časů u zpráv</label>
      <select id="cfg-timestamps">
        <option value="always">Trvale pod každou zprávou</option>
        <option value="grouped">Pouze oddělovače (jak na fotce)</option>
      </select>
    </div>

    <div class="actions-grid" style="margin-top: 24px;">
      <button class="btn btn-primary" style="flex: 1;" id="global-save-btn">Uložit nastavení</button>
      <button class="btn btn-danger" style="flex: 1;" id="global-reset-factory-btn">Obnovit výchozí</button>
    </div>

            keywords: ["cizim", "vazne", "prednost", "omlouvam", "dulezite"],
            reply: "ty vole fakt mě sereš. Tak se s tou kámoškou večer zastav ukážu vám to a dám jí klíče. 3 měsíce bez nájmu a tím jsme my dva srovnaný!"
          },
          {
            keywords: ["ktery", "kde", "foto", "fotka", "ukaz"],
            reply: "",
            image: EMBEDDED_APARTMENT
          }
        ],
        messages: [
          { sender: "incoming", text: "ja vím že ti jsem dlužnej ale já to už slíbil", time: "16:34" },
          { sender: "outgoing", text: "dáš přednost někomu cizímu? vážně?", time: "16:35" },
          { sender: "incoming", text: "ty vole fakt mě sereš. Tak se s tou kámoškou večer zastav ukážu vám to a dám jí klíče. 3 měsíce bez nájmu a tím jsme my dva srovnaný!", time: "16:36" },
          { sender: "outgoing", text: "a který to je?", time: "16:37" },
          { sender: "incoming", image: EMBEDDED_APARTMENT, time: "16:38" }
        ]
      }
    ];

    let state = {
      apiKey: DEFAULT_API_KEY,
      timestampMode: "always",
      conversations: DEFAULT_CONVERSATIONS,
      activeConvId: "martin-sobo"
    };

    function loadState() {
      const saved = localStorage.getItem("film_prop_state_v2");
      if (saved) {
        try {
          state = JSON.parse(saved);
          if (!state.apiKey && DEFAULT_API_KEY) state.apiKey = DEFAULT_API_KEY;
        } catch(e) {}
      }
      renderInbox();
    }

    function saveState() {
      localStorage.setItem("film_prop_state_v2", JSON.stringify(state));
    }

    function showScreen(screenId) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(screenId).classList.add("active");
    }

    function renderInbox() {
      const container = document.getElementById("conv-list-container");
      container.innerHTML = "";

      state.conversations.forEach(c => {
        const item = document.createElement("div");
        item.className = "conv-item";

        const lastMsg = c.messages[c.messages.length - 1];
        let snippet = "Žádné zprávy";
        let timeStr = "";
        if (lastMsg) {
          timeStr = lastMsg.time || "";
          snippet = lastMsg.image ? "Obrázek" : lastMsg.text;
          if (lastMsg.sender === "outgoing") snippet = "Vy: " + snippet;
        }

        const isOnline = c.status && c.status.toLowerCase().includes("aktivní");

        item.innerHTML = `
          <div class="conv-avatar-wrap">
            <div class="conv-avatar" style="background-image: url('${c.avatar || ""}')"></div>
            ${isOnline ? '<div class="conv-badge"></div>' : ''}
          </div>
          <div class="conv-body">
            <div class="conv-header">
              <span class="conv-name">${c.name}</span>
              <span class="conv-time">${timeStr}</span>
            </div>
            <div class="conv-snippet">${snippet}</div>
          </div>
          <div class="conv-edit-btn" title="Upravit postavu">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          </div>
        `;

        item.querySelector(".conv-body").addEventListener("click", () => openChat(c.id));
        item.querySelector(".conv-avatar-wrap").addEventListener("click", () => openChat(c.id));
        item.querySelector(".conv-edit-btn").addEventListener("click", (e) => {
          e.stopPropagation();
          openEditor(c.id);
        });

        container.appendChild(item);
      });
    }

    function openChat(convId) {
      state.activeConvId = convId;
      const c = state.conversations.find(x => x.id === convId);
      if (!c) return;

      document.getElementById("active-chat-name").innerText = c.name;
      document.getElementById("active-chat-status").innerHTML = `<span class="status-dot"></span>${c.status}`;
      const av = document.getElementById("active-chat-avatar");
      if (c.avatar) {
        av.style.backgroundImage = `url('${c.avatar}')`;
      } else {
        av.style.backgroundImage = "none";
      }

      renderChatMessages();
      showScreen("screen-chat");
    }

    function renderChatMessages() {
      const c = state.conversations.find(x => x.id === state.activeConvId);
      if (!c) return;

      const container = document.getElementById("chat-messages-container");
      container.innerHTML = '<div class="timestamp-separator">Dnes 16:32</div>';

      c.messages.forEach((m, idx) => {
        const row = document.createElement("div");
        row.className = `message-row ${m.sender}`;

        if (m.sender === "incoming") {
          const isLastInGroup = (idx === c.messages.length - 1) || (c.messages[idx + 1]?.sender !== "incoming");
          const av = document.createElement("div");
          av.className = `bubble-avatar ${isLastInGroup ? "" : "hidden"}`;
          if (c.avatar) av.style.backgroundImage = `url('${c.avatar}')`;
          row.appendChild(av);
        }

        const wrap = document.createElement("div");
        wrap.className = "bubble-content-wrap";

        const bubble = document.createElement("div");
        if (m.image) {
          bubble.className = "bubble image-bubble";
          bubble.innerHTML = `<img src="${m.image}" alt="photo">`;
        } else {
          bubble.className = "bubble";
          bubble.innerText = m.text;
        }
        wrap.appendChild(bubble);

        if (state.timestampMode === "always" && m.time) {
          const t = document.createElement("div");
          t.className = "msg-time-label";
          t.innerText = m.time;
          wrap.appendChild(t);
        }

        row.appendChild(wrap);
        container.appendChild(row);
      });

      container.scrollTop = container.scrollHeight;
    }

    function getTimeNow() {
      const d = new Date();
      return `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
    }

    async function sendChatMessage() {
      const c = state.conversations.find(x => x.id === state.activeConvId);
      if (!c) return;

      const input = document.getElementById("chat-input-field");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      const timeNow = getTimeNow();

      c.messages.push({ sender: "outgoing", text: text, time: timeNow });
      renderChatMessages();
      saveState();

      const typing = document.getElementById("chat-typing-indicator");
      typing.style.display = "flex";
      const scrollEl = document.getElementById("chat-messages-container");
      scrollEl.scrollTop = scrollEl.scrollHeight;

      const delayMs = (parseFloat(c.delay) || 2.2) * 1000;

      setTimeout(async () => {
        typing.style.display = "none";
        if (c.mode === "script") {
          processScriptReply(c, text);
        } else {
          await processAIReply(c, text);
        }
        renderChatMessages();
        saveState();
      }, delayMs);
    }

    function processScriptReply(c, userText) {
      const lower = userText.toLowerCase();
      let matched = null;
      if (c.script && Array.isArray(c.script)) {
        for (let s of c.script) {
          if (s.keywords && s.keywords.some(kw => lower.includes(kw.toLowerCase()))) {
            matched = s;
            break;
          }
        }
      }
      if (matched) {
        if (matched.reply) c.messages.push({ sender: "incoming", text: matched.reply, time: getTimeNow() });
        if (matched.image) c.messages.push({ sender: "incoming", image: matched.image, time: getTimeNow() });
      } else {
        c.messages.push({ sender: "incoming", text: "Hele teď to neřeším, ozvu se.", time: getTimeNow() });
      }
    }

    async function processAIReply(c, userText) {
      const key = state.apiKey || DEFAULT_API_KEY;
      if (!key) {
        c.messages.push({ sender: "incoming", text: "Chyba: Nastav Gemini API Key v nastavení.", time: getTimeNow() });
        return;
      }

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
        const historyParts = c.messages.slice(-8).map(m => ({
          role: m.sender === "outgoing" ? "user" : "model",
          parts: [{ text: m.text || "[odeslal fotku]" }]
        }));

        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: c.context || "Jsi kamarád. Odpovídej krátce." }] },
            contents: historyParts,
            generationConfig: { temperature: 0.2, maxOutputTokens: 100 }
          })
        });
        const data = await res.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "Jasný.";
        c.messages.push({ sender: "incoming", text: reply, time: getTimeNow() });
      } catch (err) {
        c.messages.push({ sender: "incoming", text: "Nemám signál, napíšu za chvíli.", time: getTimeNow() });
      }
    }

    document.getElementById("chat-back-btn").addEventListener("click", () => {
      renderInbox();
      showScreen("screen-inbox");
    });

    document.getElementById("chat-send-btn").addEventListener("click", sendChatMessage);
    document.getElementById("chat-input-field").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendChatMessage();
    });

    function openEditor(convId) {
      const c = state.conversations.find(x => x.id === convId);
      if (!c) return;

      document.getElementById("editor-title").innerText = "Upravit postavu: " + c.name;
      document.getElementById("edit-conv-id").value = c.id;
      document.getElementById("edit-name").value = c.name;
      document.getElementById("edit-status").value = c.status;
      document.getElementById("edit-avatar").value = c.avatar.startsWith("data:") ? "" : c.avatar;
      document.getElementById("edit-mode").value = c.mode || "ai";
      document.getElementById("edit-context").value = c.context || "";
      document.getElementById("edit-script").value = JSON.stringify(c.script || [], null, 2);
      document.getElementById("edit-delay").value = c.delay || 2.2;
      document.getElementById("edit-history").value = JSON.stringify(c.messages || [], null, 2);

      toggleEditorFields();
      showScreen("screen-editor");
    }

    function toggleEditorFields() {
      const isAI = document.getElementById("edit-mode").value === "ai";
      document.getElementById("grp-context").style.display = isAI ? "block" : "none";
      document.getElementById("grp-script").style.display = isAI ? "none" : "block";
    }
    document.getElementById("edit-mode").addEventListener("change", toggleEditorFields);

    document.getElementById("btn-add-contact").addEventListener("click", () => {
      const newId = "conv-" + Date.now();
      const newConv = {
        id: newId,
        name: "Nová Postava",
        status: "Aktivní",
        avatar: "",
        mode: "ai",
        delay: 2.0,
        context: "Jsi kamarád. Piš krátce česky v SMS stylu. Max 1-2 věty.",
        script: [],
        messages: [
          { sender: "incoming", text: "Čau, co potřebuješ?", time: getTimeNow() }
        ]
      };
      state.conversations.push(newConv);
      saveState();
      openEditor(newId);
    });

    document.getElementById("editor-save-btn").addEventListener("click", () => {
      const id = document.getElementById("edit-conv-id").value;
      const c = state.conversations.find(x => x.id === id);
      if (!c) return;

      c.name = document.getElementById("edit-name").value.trim() || "Bez jména";
      c.status = document.getElementById("edit-status").value.trim() || "Aktivní";
      const customAv = document.getElementById("edit-avatar").value.trim();
      if (customAv) c.avatar = customAv;
      c.mode = document.getElementById("edit-mode").value;
      c.context = document.getElementById("edit-context").value;
      c.delay = parseFloat(document.getElementById("edit-delay").value) || 2.0;

      try {
        c.script = JSON.parse(document.getElementById("edit-script").value);
        c.messages = JSON.parse(document.getElementById("edit-history").value);
      } catch(e) {
        alert("Chyba v syntaxi JSONu!");
        return;
      }

      saveState();
      renderInbox();
      showScreen("screen-inbox");
    });

    document.getElementById("editor-delete-btn").addEventListener("click", () => {
      const id = document.getElementById("edit-conv-id").value;
      if (state.conversations.length <= 1) {
        alert("Musí zůstat alespoň jedna konverzace.");
        return;
      }
      if (confirm("Opravdu smazat tuto postavu?")) {
        state.conversations = state.conversations.filter(x => x.id !== id);
        saveState();
        renderInbox();
        showScreen("screen-inbox");
      }
    });

    document.getElementById("editor-close-btn").addEventListener("click", () => {
      renderInbox();
      showScreen("screen-inbox");
    });

    document.getElementById("btn-open-global-settings").addEventListener("click", () => {
      document.getElementById("cfg-gemini-key").value = state.apiKey || "";
      document.getElementById("cfg-timestamps").value = state.timestampMode || "always";
      showScreen("screen-global");
    });

    document.getElementById("global-save-btn").addEventListener("click", () => {
      state.apiKey = document.getElementById("cfg-gemini-key").value.trim();
      state.timestampMode = document.getElementById("cfg-timestamps").value;
      saveState();
      showScreen("screen-inbox");
    });

    document.getElementById("global-reset-factory-btn").addEventListener("click", () => {
      if (confirm("Obnovit celou aplikaci do výchozího stavu z filmu?")) {
        localStorage.removeItem("film_prop_state_v2");
        location.reload();
      }
    });

    document.getElementById("global-close-btn").addEventListener("click", () => {
      showScreen("screen-inbox");
    });

    loadState();
  </script>
</body>
</html>
